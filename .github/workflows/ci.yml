name: Course checks

on:
  push:
  pull_request:

jobs:
  portable-c-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable C examples
        run: cmake -S examples/portable -B build/portable
      - name: Build portable C examples
        run: cmake --build build/portable
      - name: Run tests
        run: ctest --test-dir build/portable --output-on-failure
      - name: Check internal Markdown links
        run: python tools/check_links.py

  camera-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vision dependencies
        run: python -m pip install -r requirements-camera.txt
      - name: Test controller, protocol and synthetic images
        run: python -m unittest discover -s tests -v
      - name: Test portable gimbal application
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Ifirmware/stm32_gimbal firmware/stm32_gimbal/gimbal.c tests/test_gimbal.c -o build/test_gimbal
          ./build/test_gimbal
      - name: Generate integrated reader
        run: python tools/build_camera_book.py
      - name: Check course links
        run: python tools/check_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-vision-camera-notes
          path: dist/embedded-vision-camera-notes.zip

